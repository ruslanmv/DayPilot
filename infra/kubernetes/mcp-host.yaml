apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-host
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-host
  template:
    metadata:
      labels:
        app: mcp-host
    spec:
      containers:
        - name: mcp-host
          image: ghcr.io/ruslanmv/daypilot-mcp-host:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8003
          envFrom:
            - configMapRef:
                name: daypilot-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-host
spec:
  selector:
    app: mcp-host
  ports:
    - port: 8003
      targetPort: 8003
