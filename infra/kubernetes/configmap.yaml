apiVersion: v1
kind: ConfigMap
metadata:
  name: daypilot-config
data:
  DAYPILOT_ENV: "kubernetes"
  DAYPILOT_REQUIRE_APPROVAL: "true"
  DAYPILOT_WRITE_ENABLED: "false"
  DAYPILOT_DRY_RUN: "true"
  REDIS_URL: "redis://redis:6379/0"
  QDRANT_URL: "http://qdrant:6333"
  DATABASE_URL: "postgresql+psycopg://daypilot:daypilot@postgres:5432/daypilot"
