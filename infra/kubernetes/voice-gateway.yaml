apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voice-gateway
  template:
    metadata:
      labels:
        app: voice-gateway
    spec:
      containers:
        - name: voice-gateway
          image: ghcr.io/ruslanmv/daypilot-voice-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8006
          envFrom:
            - configMapRef:
                name: daypilot-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8006
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8006
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: voice-gateway
spec:
  selector:
    app: voice-gateway
  ports:
    - port: 8006
      targetPort: 8006
