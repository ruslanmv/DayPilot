# DayPilot Prometheus alert rules (batch B14).
# Load alongside prometheus.yml: rule_files: ["alerts.yml"].
groups:
  - name: daypilot-slo
    rules:
      - alert: GatewayHighErrorRate
        expr: |
          sum(rate(daypilot_gateway_request_errors_total[5m]))
            / sum(rate(daypilot_gateway_request_seconds_count[5m])) > 0.05
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "Gateway 5xx error rate above 5% for 10m"

      - alert: GatewayHighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum(rate(daypilot_gateway_request_seconds_bucket[5m])) by (le)) > 1.5
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "Gateway p95 request latency above 1.5s"

      - alert: ModelProviderDegraded
        expr: absent(daypilot_model_generations_total) == 1
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "No model generations recorded — Ollabridge may be degraded"

      - alert: AgentRunFailuresHigh
        expr: |
          sum(rate(daypilot_orchestrator_state_transitions_total{state="FAILED"}[15m])) > 0.2
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "Elevated agent run failure rate"

      - alert: IndexingJobsBacklog
        expr: daypilot_knowledge_documents_ingested_total == 0 and on() (hour() > 8 < 20)
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "No documents ingested during working hours — check indexing workers"
