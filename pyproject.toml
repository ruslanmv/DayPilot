[project]
name = "daypilot-enterprise"
version = "0.2.0"
description = "Governed AI operator workspace with HomePilot persona integration."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "prometheus-client>=0.20",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]
rag = ["sentence-transformers", "chromadb", "rank-bm25", "qdrant-client"]
models = ["ollama", "transformers", "accelerate"]
observability = ["opentelemetry-api", "opentelemetry-sdk", "prometheus-client"]

[tool.ruff]
line-length = 100
src = ["services", "scripts", "tests"]

[tool.pytest.ini_options]
pythonpath = [
  "services/mcp-host",
  "services/api-gateway",
  "services/orchestrator",
  "services/knowledge-service",
  "services/model-serving",
  "services/observability",
  "services/voice-gateway",
]
testpaths = ["tests"]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]

[tool.uv]
package = false
